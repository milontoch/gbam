# Runs on every push and pull request: type-check, dependency audit, build, and the browser tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Type-check
        run: |
          set +e
          npm run check > check.log 2>&1
          code=$?
          cat check.log
          # On failure, copy the end of the output into a short annotation so it can be read without signing in.
          if [ $code -ne 0 ]; then
            echo "::error title=Type-check failed::$(tail -n 40 check.log | head -c 3500 | tr '\n' '|' | tr '%' ' ')"
          fi
          exit $code
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Browser tests
        run: |
          set +e
          node tests/run.mjs > tests.log 2>&1
          code=$?
          tail -n 60 tests.log
          if [ $code -ne 0 ]; then
            echo "::error title=Browser tests failed::$(grep -E '^FAIL|passed|crash|Failures|^ - ' tests.log | head -n 25 | head -c 3500 | tr '\n' '|' | tr '%' ' ')"
          fi
          exit $code
